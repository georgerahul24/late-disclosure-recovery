[project]
name = "recheck"
version = "0.1.0"
description = "Late-disclosure recovery benchmark and RECHECK agent for stateful clinical scheduling agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# TF-IDF detector baseline used by the scripted pilot.
ml = ["scikit-learn>=1.4", "numpy>=1.26"]
# LLM orchestrator runs (Phase 3+). Not needed for the pilot.
llm = ["openai>=1.40", "vllm>=0.6; platform_system == 'Linux'"]
# LoRA detector training (Phase 2).
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33"]
dev = ["pytest>=8"]
# Model-based timing analysis (scripts/timing_model.py).
stats = ["pandas>=2.0", "statsmodels>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
